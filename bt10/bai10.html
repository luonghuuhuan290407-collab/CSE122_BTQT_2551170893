<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang liên hệ</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>
    <form class="contact-form" action="#" method="POST">
        <div class="form-header">
            <h2>Liên hệ với chúng tôi</h2>
            <p>Vui lòng điền thông tin...</p>
        </div>
        <div class="form-body">
            <div class="form-row">
                <div class="form-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn An">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="an.nv@tlu.edu.vn">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="0987654321">
                </div>
                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <select name="subject" id="subject">
                        <option value="khoahoc">Hỏi về khóa họcn</option>
                        <option value="tuvan">Tư vấn tuyển sinh</option>
                        <option value="khac">Ý kiến khác</option>
                    </select>
                </div>
            </div>
            <div class="form-group full-width">
                <label for="message">Nội dung</label>
                <textarea name="message>" id="message>" rows="4" placeholder="Em muốn hỏi về lịch nộp bài tập..."></textarea>
            </div>
            <div class="form-group checkbox-group">
                <label for="agree">Tôi đồng ý nhận email phản hồi lại.</label>
                <input type="checkbox" id="agree" name="agree">
            </div>
            <div class="bitton-group">
                <button type="submit" > Gửi liên hệ</button>
                <button type="reset">Nhập lại</button>
            </div>
        </div>
        
    </form>

</body>
</html>
