<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 30 - Bảng điều khiển (Bootstrap)</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style30.css">
</head>
<body class="bg-light">

  <div class="d-flex wrapper">
    
    <nav id="sidebar" class="bg-dark text-white p-3 d-flex flex-column flex-shrink-0">
      <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <span class="fs-5 fw-bold px-2">CSE.TLU Admin</span>
      </a>
      <hr class="text-secondary">
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="#" class="nav-link active py-2" aria-current="page">
            Bảng điều khiển
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-white py-2">
            Bài tập
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-white py-2">
            Sinh viên
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-white py-2">
            Điểm số
          </a>
        </li>
      </ul>
    </nav>

    
    <div class="main-content flex-grow-1 p-4">
      
      <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h3 class="fw-bold text-dark mb-0">Bảng điều khiển</h3>
        <div class="d-flex gap-2">
          <span class="badge bg-warning text-dark d-flex align-items-center px-3 py-2 fw-semibold">3 bài mới</span>
          <button class="btn btn-primary btn-sm px-3 fw-medium">Xuất báo cáo</button>
        </div>
      </div>

      <div class="row g-3 mb-4">
        
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm p-3 h-100 rounded-3">
            <span class="text-secondary small fw-medium">Sinh viên</span>
            <h2 class="fw-bold my-2 text-dark">128</h2>
            <div class="progress" style="height: 4px;">
              <div class="progress-bar bg-primary" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm p-3 h-100 rounded-3">
            <span class="text-secondary small fw-medium">Đã nộp</span>
            <h2 class="fw-bold my-2 text-dark">96</h2>
            <div class="progress" style="height: 4px;">
              <div class="progress-bar bg-success" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm p-3 h-100 rounded-3">
            <span class="text-secondary small fw-medium">Chưa nộp</span>
            <h2 class="fw-bold my-2 text-dark">32</h2>
            <div class="progress" style="height: 4px;">
              <div class="progress-bar bg-danger" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm p-3 h-100 rounded-3">
            <span class="text-secondary small fw-medium">Điểm TB</span>
            <h2 class="fw-bold my-2 text-dark">7.8</h2>
            <div class="progress" style="height: 4px;">
              <div class="progress-bar bg-warning" role="progressbar" style="width: 78%;" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        </div>

      </div>

      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white py-3 border-bottom">
          <h6 class="fw-bold text-dark mb-0">Tiến độ theo chương</h6>
        </div>
        <div class="card-body p-0">
          <ul class="list-group list-group-flush">
            
            <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
              <span>Chương 1 — HTML5</span>
              <span class="badge bg-success px-3 py-2">100%</span>
            </li>
            
            <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
              <span>Chương 2 — JavaScript</span>
              <span class="badge bg-primary px-3 py-2">82%</span>
            </li>
            
            <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
              <span>Chương 3 — CSS3</span>
              <span class="badge bg-info text-dark px-3 py-2">74%</span>
            </li>
            
            <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-4">
              <span>Chương 4 — Bootstrap 5</span>
              <span class="badge bg-secondary px-3 py-2">45%</span>
            </li>

          </ul>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js30.js"></script>
</body>
</html>
