<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 26 - Form đăng ký với Bootstrap</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style26.css">
</head>
<body class="bg-light py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow border-0 rounded-3 my-card">
          <div class="card-header bg-success text-white text-center py-3">
            <h3 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h3>
          </div>
          <div class="card-body p-4">
            <form id="registrationForm" class="needs-validation" novalidate>
            
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <label for="fullName" class="form-label fw-medium">Họ và tên</label>
                  <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                  <div class="invalid-feedback">Vui lòng nhập họ và tên.</div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="studentId" class="form-label fw-medium">Mã sinh viên</label>
                  <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                  <div class="invalid-feedback">Vui lòng nhập mã sinh viên.</div>
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label fw-medium">Email</label>
                  <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                  <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label fw-medium">Số điện thoại</label>
                  <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" pattern="[0-9]{10}" required>
                  <div class="invalid-feedback">Vui lòng nhập số điện thoại hợp lệ (10 chữ số).</div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-medium d-block">Trình độ</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="level" id="levelBasic" value="Cơ bản" checked required>
                  <label class="form-check-label" for="levelBasic">Cơ bản</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="level" id="levelMedium" value="Khá" required>
                  <label class="form-check-label" for="levelMedium">Khá</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="level" id="levelAdvanced" value="Tốt" required>
                  <label class="form-check-label" for="levelAdvanced">Tốt</label>
                </div>
              </div>
              <div class="mb-3">
                <label for="classSelect" class="form-label fw-medium">Chọn lớp</label>
                <select class="form-select" id="classSelect" required>
                  <option value="" selected disabled>-- Chọn lớp học --</option>
                  <option value="67CNTT1">67CNTT1</option>
                  <option value="67CNTT2">67CNTT2</option>
                  <option value="67KTPM1">67KTPM1</option>
                  <option value="67KTPM2">67KTPM2</option>
                </select>
                <div class="invalid-feedback">Vui lòng chọn lớp học.</div>
              </div>
              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="commitmentCheck" required>
                  <label class="form-check-label" for="commitmentCheck">
                    Tôi cam kết tự làm bài và quay video OBS
                  </label>
                  <div class="invalid-feedback">Bạn phải đồng ý cam kết trước khi gửi.</div>
                </div>
              </div>
              <div class="d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                <button type="submit" class="btn btn-success px-4" style="background-color: #198754;">Đăng ký</button>
              </div>

            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
  <script src="js26.js"></script>
</body>
</html>
