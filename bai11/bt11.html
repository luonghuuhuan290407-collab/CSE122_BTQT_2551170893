<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh</title>
    <link rel="stylesheet" href="style11.css">
</head>
<body>
    <header class="header">
        <h1>Thư viện ảnh Việt Nam</h1>
        <p>Bộ sưu tập 6 danh thắng tiêu biểu-minh họa thẻ figure/figcaption.</p>

    </header>
    <main class="gallery-container">
        <figure class="gallery-item">
            <img src="1-vinh-ha-long.jpg" alt="VHL">
            <figcaption>Hình 1.Vịnh Hạ Long</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="2-son-doong.jpg" alt="HSD">
            <figcaption>Hình 2.Hang Sơn Đoong</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="3-thac-ban-gioc.jpg" alt="TBG">
            <figcaption>Hình 3.Thác Bản Giốc</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="4-fansipan.jpg" alt="FSP">
            <figcaption>Hình 4.Fansipan</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="5-mekong.jpg" alt="SMK">
            <figcaption>Hình 5.Đồng bằng sông Cửu Long</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="6-phong-nha.jpg" alt="ĐPN">
            <figcaption>Hình 6.Động Phong Nha</figcaption>
        </figure>
    </main>

</body>
</html>
