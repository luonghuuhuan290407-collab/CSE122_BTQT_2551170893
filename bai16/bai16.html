<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc cần làm</title>
    <link rel="stylesheet" href="style16.css">
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <h2>Danh sách việc cần làm</h2>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xóa- tất cả bằng JavaScript</p>
        </div>
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Nhập công việc mới...">
            <button id="addBtn">Thêm</button>
        </div>
        <ul id="taskList">
            <li class="completed">
                <span class="checkbox"></span>
                <span class="task-text">Đọc chương HTML5 cơ bản</span>
                <button class="delete-btn">Xóa</button>
            </li>

            <li>
                <span class="checkbox"></span>
                <span class="task-text">Làm bài tập CSS Grid</span>
                <button class="delete-btn">Xóa</button>
            </li>

            <li>
                <span class="checkbox"></span>
                <span class="task-text">quay video OBS nộp bài</span>
                <button class="delete-btn">Xóa</button>  
            </li>
        </ul>
        <div class="app-footer">
            <span id="counter">Còn 2 việc chưa hoàn thành</span>
        </div>
    </div>
    <script src="js5.js"></script>
</body>
</html>
