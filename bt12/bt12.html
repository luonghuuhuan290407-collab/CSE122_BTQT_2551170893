<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch</title>
    <link rel="stylesheet" href="style12.css">
</head>
<body>
    <div class="main-card">
        <div class="calendar-box">
            <div id="year-display" class="year">2026</div>
            <div id="month-display" class="month">Tháng 12</div>
            <div id="day-display" class="day">24</div>
            <div id="weekday-display" class="weekday">Thứ hai</div>
        </div>
        <div id="greeting-display" class="greeting">Chào buổi sáng!</div>
        <div class="form-container">
            <div class="input-group">
                <label for="input-day">Ngày</label>
                <input type="number" id="input-day" value="24" min="1" max="31">
            </div>
            <div class="input-group">
                <label for="input-month">Tháng</label>
                <input type="number" id="input-month" value="12" min="1" max="12">
            </div>
            <div class="input-group">
                <label for="input-year">Năm</label>
                <input type="number" id="input-year" value="2026">
            </div>
            <button id="btn-print">In<br>lịch</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
